[workspace]
members = [
    "kernel",
    "crates/pico-abi",
    "crates/pico-lib",
    "crates/pico-macros",
    "crates/pico-runtime",
]
default-members = [
    "kernel",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
toml = "0.8"
pico-macros = { path = "crates/pico-macros" }
pico-abi = { path = "crates/pico-abi" }
pico-lib = { path = "crates/pico-lib" }
pico-runtime = { path = "crates/pico-runtime" }

[profile.dev]
panic = "abort"
debug = 2
opt-level = 0

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true
