[workspace]
members = [
    "kernel",
]
default-members = [
    "kernel",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
toml = "0.8"

[profile.dev]
panic = "abort"
debug = 2
opt-level = 0

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true
