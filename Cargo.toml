[package]
name = "Pico-OS"
version = "0.0.1"
edition = "2024"

[package.metadata.pico-os]
flash-size-mb = 16
user-flash-size-kb = 256

[features]
default = ["RP2040"]
RP2040 = []

[profile.dev]
panic = "abort"
debug = 2
opt-level = 0

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
toml = "0.8"

