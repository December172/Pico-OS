# Default target for a bare `cargo build` (RP2040 / Pico 16M).
[build]
target = "thumbv6m-none-eabi"

# --- Architecture switch ------------------------------------------------------
# Instead of editing [build] target by hand, pick the chip with an alias:
#
#   cargo pico2040 [extra args]   # RP2040 / Cortex-M0+  (Pico, Pico 16M)
#
# Extra arguments are appended, e.g. `cargo pico2040 --profile release`.
# The explicit --target below overrides [build] target, and each alias also
# selects the matching feature set, so the two builds stay independent.
[alias]
pico2040 = "build -p pico-kernel --bin kernel --target thumbv6m-none-eabi -Zbuild-std=core --no-default-features --features RP2040"
